# ---------------------------------------------------------------------------
# DurhamWIND — global site settings and controlled vocabularies.
#
# This file is the single source of truth for the group's name, blurbs, and
# the labels/ordering used across the website and the GitHub org profile.
# Edit here; both renderers pick it up.
# ---------------------------------------------------------------------------

name: DurhamWIND
full_name: "DurhamWIND: Atmospheric Flow and Wind Energy Dynamics Group"
institution: Durham University
url: https://durhamwind-lab.github.io
github_org: https://github.com/DurhamWIND-lab

tagline: Atmospheric flow and wind energy dynamics at Durham University

# One paragraph. Used on the site home page and the org profile README.
intro: >
  DurhamWIND is an interdisciplinary group at Durham University working on the
  fluid mechanics of wind energy — from the aerodynamics of a single rotor to
  the interaction of whole wind farms with the atmospheric boundary layer, and
  on to the systems that get that energy built and delivered. We bring together expertise in
  wind-farm aerodynamics, laboratory experiment, geophysical fluid dynamics
  and applied mathematics, and artificial intelligence.

# No group-wide contact address, by design: the group is collaborative, and a
# single mailto reads as though one person fronts it. Enquiries go to whichever
# member's work is closest to the enquiry — their emails live on their entry in
# people.yml and are rendered on the People page.
contact:
  address_lines:
    - Durham University
    - Durham DH1 3LE
    - United Kingdom

# --- Role tiers -------------------------------------------------------------
# `key` is what a person's `role:` field must match. Order here is the order
# sections appear on the People page.
roles:
  - key: investigator
    label: Investigators
    blurb: >
      Academic staff leading the group's research across engineering and
      mathematics.
  - key: postdoc
    label: Postdoctoral Researchers
    blurb: ""
  - key: phd
    label: PhD Students
    blurb: ""
  - key: msc
    label: Masters Students
    blurb: ""
  - key: visitor
    label: Visitors
    blurb: ""
  - key: alum
    label: Alumni
    blurb: ""

# --- Website copy -----------------------------------------------------------
# Every sentence the website says in its own voice. It lives here so that all
# editable prose is in this one file, rather than half of it being buried in
# page templates in the website repository.
#
# `lede` is the line under each page's title. `intro` blocks may contain HTML
# links. Headings and blurbs belong to a section of a page.
copy:
  home:
    eyebrow: Durham University
    headline: The fluid mechanics of wind energy, from the blade to the atmospheric boundary layer.
    # Figures live in Profile/Figures/. `alt` is required — describe what the
    # image shows. `caption` appears beneath it; `credit` is the attribution.
    hero_image: wake-velocity-field.jpg
    hero_alt: >
      Measured velocity field behind a model wind turbine in a wind tunnel,
      with the wake showing as a dark low-speed band spreading downstream
      through faster surrounding flow.
    hero_caption: The wake of a model turbine, measured in the wind tunnel.
    figure_image: wake-velocity-field.gif
    figure_alt: >
      Animated wind tunnel measurements behind a model turbine, cycling between
      the wind speed field, where the wake appears as a dark low-speed band,
      and the vorticity field, where rows of tip and root vortices show as
      discrete red and blue cores.
    figure_caption: >
      The same measurement in motion, in wind speed and then vorticity. The
      wake is unsteady, and that unsteadiness is what sets how quickly it
      recovers.
    themes_heading: Research themes
    themes_blurb: >
      What we work on, spanning the Departments of Engineering and Mathematical
      Sciences.
    code_heading: Open code
    code_blurb: We publish the code and data behind our papers wherever we can.
    code_fallback_heading: Everything else
    code_fallback_text: All of the group's public repositories live in one GitHub organisation.
    hiring_heading: We're hiring
   
  research:
    title: Research
    lede: >
      One problem — understanding and improving how wind farms take energy out
      of the atmosphere.
    description: >
      Research themes at DurhamWIND — wake models, atmospheric boundary layer
      and geophysical fluid dynamics, wind tunnel experiments, wake steering
      and flow control, floating offshore wind, and energy systems and risk.
    intro: >
      Our work runs from the aerodynamics of a single rotor through to the
      systems that get wind capacity built and delivered. What holds it
      together is a preference for models that are simple enough to reason
      about and fast enough to use — grounded in the physics, but built for the
      problems industry actually faces. Models developed here are implemented
      in <a href="https://github.com/NREL/floris">FLORIS</a> (NREL) and
      <a href="https://github.com/DTUWindEnergy/PyWake">PyWake</a> (DTU).
    code_heading: Code & data
    code_text: >
      We publish the code behind our papers where we can. Repositories live in
      the <a href="https://github.com/DurhamWIND-lab">DurhamWIND GitHub
      organisation</a>.

  people:
    title: People
    lede: >
      An interdisciplinary group spanning engineering and mathematics, from
      rotor aerodynamics to geophysical fluid dynamics to AI for energy
      infrastructure.
    description: >
      The people of DurhamWIND — investigators, postdoctoral researchers and
      PhD students at Durham University working on wind energy and atmospheric
      flow.
    joining_heading: Joining us
    joining_text: >
      We welcome enquiries from prospective PhD students, postdoctoral
      researchers and collaborators. Write to whichever of us works closest to
      what interests you — the addresses are on the cards above.

  publications:
    title: Publications
    lede: >
      Peer-reviewed journal articles by group members on wind energy and the
      atmospheric flows wind farms sit in.
    description: >
      Publications from DurhamWIND at Durham University — wake modelling,
      atmospheric boundary layer flows, wake steering, floating offshore wind
      and energy systems.

  contact:
    title: Enquiries & join us
    lede: We welcome collaboration, and enquiries from prospective students and researchers.
    description: >
      Enquiries, collaboration and current openings for postdoctoral
      researchers and PhD students at DurhamWIND, Durham University.
    find_us_heading: Where to find us
    who_heading: Who to write to
    who_text: >
      We do not run a central inbox. Write to whichever of us works closest to
      what interests you — nobody will mind an email that turns out to be
      better answered by a colleague, and we will pass it on.
    openings_heading: Openings
    openings_blurb: Current advertised positions in the group.
    openings_none: No advertised positions at the moment.
    phd_heading: Prospective PhD students
    phd_text: >
      We are always glad to hear from strong candidates interested in wind
      energy, atmospheric turbulence and environmental fluid mechanics —
      including those bringing a background in applied mathematics, machine
      learning or data science rather than classical fluid dynamics. Send a CV
      and a short note on what interests you to whichever investigator's work
      is closest to your own; their addresses are just above.

