# ---------------------------------------------------------------------------
# DurhamWIND — global site settings and controlled vocabularies.
#
# This file is the single source of truth for the group's name, blurbs, and
# the labels/ordering used across the website and the GitHub org profile.
# Edit here; both renderers pick it up.
# ---------------------------------------------------------------------------

name: DurhamWIND
full_name: "DurhamWIND: Atmospheric Flow and Wind Energy Dynamics Group"
institution: Durham University
url: https://durhamwind-lab.github.io
github_org: https://github.com/DurhamWIND-lab

tagline: Atmospheric flow and wind energy dynamics at Durham University

# One paragraph. Used on the site home page and the org profile README.
intro: >
  DurhamWIND is an interdisciplinary group at Durham University working on the
  fluid mechanics of wind energy — from the aerodynamics of a single rotor to
  the interaction of whole wind farms with the atmospheric boundary layer, and
  on to the systems that get that energy built and delivered. We bring together
  wind-farm aerodynamics and laboratory experiment, geophysical fluid dynamics
  and applied mathematics, and artificial intelligence for infrastructure and
  risk, across the Departments of Engineering and Mathematical Sciences.

# No group-wide contact address, by design: the group is collaborative, and a
# single mailto reads as though one person fronts it. Enquiries go to whichever
# member's work is closest to the enquiry — their emails live on their entry in
# people.yml and are rendered on the People page.
contact:
  address_lines:
    - Durham University
    - Durham DH1 3LE
    - United Kingdom

# --- Role tiers -------------------------------------------------------------
# `key` is what a person's `role:` field must match. Order here is the order
# sections appear on the People page.
roles:
  - key: investigator
    label: Investigators
    blurb: >
      Academic staff leading the group's research across engineering and
      mathematics.
  - key: postdoc
    label: Postdoctoral Researchers
    blurb: ""
  - key: phd
    label: PhD Students
    blurb: ""
  - key: msc
    label: Masters Students
    blurb: ""
  - key: visitor
    label: Visitors
    blurb: ""
  - key: alum
    label: Alumni
    blurb: ""

