- id: nima-gerami-seresht
  name: Nima Gerami-Seresht
  title: Assistant Professor of Sustainable and Resilient Infrastructure
  role: investigator
  department: Department of Engineering
  photo: Nima.jpg
  email: nima.gerami-seresht@durham.ac.uk
  expertise:
    - machine-learning
    - risk-resilience
    - digital-infrastructure
    - optimisation-control
  links:
    scholar: https://scholar.google.com/citations?hl=en&user=gNiWjhEAAAAJ
    durham: https://www.durham.ac.uk/staff/nima-gerami-seresht/
    linkedin: https://www.linkedin.com/in/nima-gerami-seresht/
  bio: >
    I work on sustainable and resilient infrastructure, having received my PhD
    in Construction Engineering and Management from the University of Alberta
    in 2017. My theoretical research concerns dynamic multi-agent systems,
    granular computing and building information modelling; my applied work is
    directed at digital construction, simulating construction processes, and
    the sustainability and resilience of urban infrastructure. I apply
    artificial intelligence techniques — fuzzy computation, machine learning
    and computer vision — to capture human behaviour in the built environment.
    In wind energy, my research addresses risk identification and assessment
    for wind farm projects: the deployment and delivery side of getting
    renewable capacity built.

# =========================== PHD STUDENTS ==================================

- id: jordan-fuentes-holden
  name: Jordan Fuentes Holden
  title: PhD Student
  role: phd
  department: Department of Engineering
  photo: Jordan.jpg
  expertise:
    - flow-control
    - aerodynamics
    - experimental-fluid-mechanics
  project: >
    I develop a smart wind turbine with trailing-edge flaps that can actively
    control the airflow around the blades and manipulate its wake to improve
    efficiency and overall performance.
  supervisors:
    - Majid Bastankhah (primary)
    - David Sims-Williams
    - Lian Gan
    - Jim Gilbert (University of Hull)

- id: mohammad-roshani
  name: Mohammad Roshani
  title: PhD Student
  role: phd
  department: Department of Engineering
  photo: Mohammad.JPG
  email: mohammad.roshani@durham.ac.uk
  expertise:
    - floating-offshore
    - wake-modelling
    - aerodynamics
  bio: >
    I am a PhD student working on floating offshore wind at Durham University.
    I am interested in how wind flows interact with floating wind turbines,
    especially because these turbines can move in all six degrees of freedom.
  supervisors:
    - Majid Bastankhah (primary)
    - Jacob Burrows (EDF UK R&D, Lead Researcher)
    - Christophe Peyrard (EDF R&D France, floating offshore wind)

- id: alexia-everley
  name: Alexia Everley
  title: PhD Student
  role: phd
  department: Department of Engineering
  photo: Alexia.jpg
  email: alexia.everley@durham.ac.uk
  expertise:
    - reduced-order-modelling
    - atmospheric-boundary-layer
    - applied-mathematics
  bio: >
    Having studied mathematics in the form of an MMath degree at Durham
    University, I am now a PhD student within the Department of Engineering at
    Durham University.
  project: >
    The main focus of my work is on developing reduced order models to
    simulate flow around wind farms. I am interested in capturing the
    interactions between wind farms as well as the large-scale interaction
    with the atmospheric boundary layer.
  supervisors:
    - Majid Bastankhah (Department of Engineering, Durham University)
    - Hossein Amini Kafiabad (Department of Mathematical Sciences, Durham University)

