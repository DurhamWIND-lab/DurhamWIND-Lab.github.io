# =========================== INVESTIGATORS =================================

- id: majid-bastankhah
  name: Majid Bastankhah
  title: Associate Professor
  role: investigator
  department: Department of Engineering
  photo: Majid.jpg
  email: majid.bastankhah@durham.ac.uk
  expertise:
    - wake-modelling
    - aerodynamics
    - experimental-fluid-mechanics
    - atmospheric-boundary-layer
    - turbulence
  links:
    scholar: https://scholar.google.com/citations?user=784pzQQAAAAJ&hl=en
    durham: https://www.durham.ac.uk/staff/majid-bastankhah/
    linkedin: https://www.linkedin.com/in/majid-bastankhah-23058240/
  bio: >
    I am a fluid dynamicist with a deep interest in environmental science and
    sustainable energy, particularly offshore wind. I earned my BSc and MSc in
    Mechanical Engineering from Sharif University of Technology in Iran, then
    moved to EPFL in Switzerland for my PhD, joining Durham in 2018. We use
    theory, simulation and laboratory experiment to understand how wind
    turbines and wind farms interact with the atmosphere. Colleagues in the
    wind energy community may know me best for analytical wake models — the
    Gaussian, or Bastankhah, wake model among them — which are used across
    academia and industry and are implemented in tools such as FLORIS (NREL)
    and PyWake (DTU). My main passion is building simple, physically grounded
    models by simplifying the equations that govern fluid motion: models
    rooted in fundamental physics but practical enough for the fast-paced
    world of industry. More recently that work has expanded into data-driven
    methods that build on physics-based modelling rather than replacing it.
  roles_extra:
    - Associate Editor, Wind Energy Science
    - Editorial Board, Wind Energy
    - Fellow of the Higher Education Academy

# TODO(Majid): Hossein's bio below is adapted from kafiabad.com and his Durham
# staff page. Worth sending him the rendered page before you announce it.
- id: hossein-amini-kafiabad
  name: Hossein Amini Kafiabad
  title: Associate Professor
  role: investigator
  department: Department of Mathematical Sciences
  photo: Hossein.jpg
  email: hossein.amini-kafiabad@durham.ac.uk
  expertise:
    - geophysical-fluid-dynamics
    - turbulence
    - applied-mathematics
    - cfd-les
  links:
    website: https://kafiabad.com/
    scholar: https://scholar.google.com/citations?user=Rv1ZtYAAAAAJ&hl=en
    orcid: https://orcid.org/0000-0002-8791-9217
    durham: https://www.durham.ac.uk/staff/hossein-amini-kafiabad/
  bio: >
    I am an applied mathematician and fluid dynamicist in the Department of
    Mathematical Sciences. My research is in numerical and theoretical
    geophysical fluid dynamics, and most prominently in the interaction of
    waves, vortices and turbulence in the atmosphere and ocean. I also develop
    computational tools and methods for problems across physics and
    engineering. I completed my PhD at McGill University with Prof. Peter
    Bartello, studying balance dynamics in rotating stratified turbulence, and
    from 2018 to 2022 was a postdoctoral researcher and university teacher at
    the University of Edinburgh with Prof. Jacques Vanneste. Within
    DurhamWIND, my work connects wind farm flows to the large-scale
    atmospheric dynamics they sit inside.

